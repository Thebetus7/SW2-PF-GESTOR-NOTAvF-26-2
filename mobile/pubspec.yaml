name: gestornotas_mobile
description: "Aplicación móvil Flutter para escaneo, captura de exámenes JPG y auditoría post-detalle docente."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  qr_code_scanner: ^1.0.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
