services:
  postgres:
    image: postgres:16-alpine
    container_name: gestornotas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestornotas_db}
      POSTGRES_USER: ${POSTGRES_USER:-gestornotas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestornotas_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gestornotas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestornotas_user} -d ${POSTGRES_DB:-gestornotas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestornotas_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-key-sw2-pf-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web}
      USE_SQLITE: "False"
      POSTGRES_DB: ${POSTGRES_DB:-gestornotas_db}
      POSTGRES_USER: ${POSTGRES_USER:-gestornotas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestornotas_secure_pass_2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestornotas_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestornotas_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    depends_on:
      - backend
    networks:
      - gestornotas_network

volumes:
  postgres_data:
    driver: local
  media_volume:
    driver: local

networks:
  gestornotas_network:
    driver: bridge
